<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #ffffff; }
    .page { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
    .container { width: 100%; max-width: 375px; padding: 24px; text-align: center; display: flex; flex-direction: column; justify-content: center; }
    h1 { font-size: 34px; font-weight: 700; line-height: 1.1; margin-bottom: 36px; }
    .input-group { position: relative; margin-bottom: 18px; text-align: left; }
    .input-group input { width: 100%; height: 52px; padding: 0 46px; border-radius: 14px; border: 1px solid #e1e1e1; font-size: 15px; outline: none; background: #fff; }
    .input-group i { position: absolute; top: 50%; transform: translateY(-50%); color: #9a9a9a; font-size: 16px; }
    .left-icon { left: 16px; }
    .right-icon { right: 16px; cursor: pointer; }
    .btn-primary, .btn-secondary { width: 100%; height: 54px; border-radius: 14px; font-size: 16px; font-weight: 600; border: none; cursor: pointer; margin-bottom: 12px; }
    .btn-primary { background: #111111; color: #fff; }
    .btn-secondary { background: #e1e1e1; color: #111; }
    .forgot-links { font-size: 14px; color: #666; margin-bottom: 16px; text-align: right; }
    .forgot-links a { color: #000; font-weight: 600; text-decoration: none; }
    .create-account { font-size: 14px; color: #666; text-align: center; }
    .create-account a { color: #000; font-weight: 600; text-decoration: none; margin-left: 4px; }
    @media (max-height: 600px) { .page { align-items: flex-start; padding-top: 40px; padding-bottom: 40px; } }
    @media (max-width: 400px) { .container { padding: 16px; } h1 { font-size: 28px; } .input-group input { height: 48px; } .btn-primary, .btn-secondary { height: 50px; font-size: 15px; } }
  </style>
</head>
<body>
  <div class="page">
    <div class="container">
      <h1>Sign In</h1>

      <div class="input-group">
        <i class="fa-regular fa-user left-icon"></i>
        <input type="text" placeholder="Username or Email" />
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock left-icon"></i>
        <input type="password" placeholder="Password" />
        <i class="fa-regular fa-eye right-icon"></i>
      </div>

      <div class="forgot-links">
        <a href="Password.html">Forgot Password?</a>
      </div>

      <button class="btn-primary">Sign In</button>
      <button class="btn-secondary" onclick="window.location.href='Create.html'">Create Account</button>
    </div>
  </div>
</body>
</html>
